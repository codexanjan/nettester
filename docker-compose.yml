version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: speedtest_db
      POSTGRES_USER: speedtest_user
      POSTGRES_PASSWORD: speedtest_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedtest_user -d speedtest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netscope-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://speedtest_user:speedtest_password@postgres:5432/speedtest_db
      - ENV=production
      - CORS_ORIGINS=["*"]
      - MAX_UPLOAD_SIZE_MB=100
      - ADMIN_API_KEY=netscope-admin-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netscope-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=/api

volumes:
  postgres_data:
